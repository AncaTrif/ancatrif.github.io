  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');

      setStatus('Error: missing bundle data');

    const blobUrls = {};

      const entry = manifest[uuid];

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ding-top:12px; min-width:260px;\">\n              <div style=\"background:#2C2280; border:3px solid #2C2280; display:flex; flex-direction:column;\">\n                <a href=\"https://ancatrif.com/a3-tool/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">Produkt und Engineering<\u002Fa>\n                <a href=\"https://ancatrif.com/hr-agent/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">Personal und Kultur<\u002Fa>\n                <a href=\"https://loop-brief-presentation.onrender.com/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">Teamübergreifende Zusammenarbeit<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"position:relative;\" sc-camel-on-mouse-enter=\"{{ openLearningTools }}\" sc-camel-on-mouse-leave=\"{{ closeLearningTools }}\">\n          <span style=\"color:#2C2280; cursor:pointer; padding-bottom:2px; border-bottom:2px solid transparent; display:inline-flex; align-items:center; gap:4px;\">Lerntools <span style=\"font-size:9px;\">▾<\u002Fspan><\u002Fspan>\n          <sc-if value=\"{{ learningToolsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute; top:100%; left:0; padding-top:12px; min-width:260px;\">\n              <div style=\"background:#2C2280; border:3px solid #2C2280; display:flex; flex-direction:column;\">\n                <a href=\"https://gdpr-quiz.ancatrif.com\" target=\"_blank\" rel=\"noopener\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">DSGVO- &amp; EU-KI-Gesetz-Quiz<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"top\" data-screen-label=\"Hero\" style=\"max-width:1240px; margin:0 auto; padding:0 32px;\">\n    <div style=\"display:grid; grid-template-columns:1.08fr 0.92fr; gap:0; align-items:stretch; min-height:calc(100vh - 64px);\">\n      <div style=\"padding:72px 56px 72px 0; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.24em; margin-bottom:28px; display:flex; align-items:center; gap:12px;\">\n          <span style=\"width:32px; height:3px; background:#2C2280; display:inline-block;\"><\u002Fspan>Portfolio · Operative Befähigung\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:clamp(28px,4.4vw,64px); line-height:0.86; letter-spacing:-0.04em; margin:0 0 28px; text-transform:uppercase;\">Hallo, ich bin<br>Anca<\u002Fh1>\n        <p style=\"font-family:'Archivo',sans-serif; font-weight:600; font-size:clamp(20px,2.2vw,28px); line-height:1.25; letter-spacing:-0.01em; max-width:32ch; margin:0 0 20px;\">Ich baue mit KI und bewahre dabei die menschliche Seite.<\u002Fp>\n        <p style=\"font-family:'Archivo',sans-serif; font-weight:400; font-size:17px; line-height:1.6; max-width:50ch; margin:0 0 40px; color:#382E8F;\">Mit 10 Jahren Erfahrung im organisatorischen Wandel helfe ich Teams herauszufinden, welche KI-Anwendungsfälle sich wirklich lohnen, und in welcher Reihenfolge. Ich beginne mit einem Priorisierungsrahmen, führe die Discovery-Phase durch und baue und iteriere dann einen funktionierenden Prototyp, bis hin zu etwas Produktionsreifem, mit Governance und Nachvollziehbarkeit von der ersten Entscheidung an, nicht nachträglich angeflanscht.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:14px;\">\n          <a href=\"#projects\" style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; background:#2C2280; color:#E9E70C; text-decoration:none; padding:16px 26px; border:3px solid #2C2280;\" style-hover=\"background:#E9E70C; color:#2C2280;\">Meine Arbeit ansehen →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; align-self:stretch; border-left:3px solid #2C2280;\">\n        <img src=\"46a015ad-42e0-4434-801d-3427e02a83a7\" alt=\"Holzschnitt/Siebdruck-artiges Porträt von Anca Trif in Gelb, Schwarz und Weiß\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:32% 38%; display:block;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ABOUT -->\n  <section id=\"about\" data-screen-label=\"Über mich\" style=\"background:#2C2280; color:#FAFAF2; border-top:3px solid #2C2280;\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:96px 32px; display:grid; grid-template-columns:0.36fr 0.64fr; gap:48px;\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.24em; color:#E9E70C; margin-bottom:18px;\">01 · Über mich<\u002Fdiv>\n        <div style=\"width:88px; height:88px; border-radius:50%; background:#E9E70C;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:'Archivo',sans-serif; font-weight:600; font-size:clamp(24px,3vw,38px); line-height:1.28; letter-spacing:-0.02em; margin:0 0 32px;\">Ich arbeite an der Schnittstelle von Betrieb, KI und Menschen und befähige Teams, mit KI zu bauen, während die menschliche Seite durch gesunde, schlanke Governance erhalten bleibt.<\u002Fp>\n        <p style=\"font-family:'Archivo',sans-serif; font-weight:400; font-size:18px; line-height:1.7; max-width:62ch; margin:0 0 20px; color:#CFC9EC;\">Mein Fokus liegt auf operativer Befähigung: Menschen dabei zu helfen, KI tatsächlich im Arbeitsalltag zu nutzen. Zu entscheiden, wann sie in eine Aufgabe gehört, sich mit den relevanten Regeln vertraut zu machen und Routinearbeit zu automatisieren, damit Aufmerksamkeit dort hingeht, wo Menschen den größten Mehrwert bieten. Jedes Projekt unten ist eine funktionierende Antwort auf eine dieser Fragen.<\u002Fp>\n        <p style=\"font-family:'Archivo',sans-serif; font-weight:400; font-size:18px; line-height:1.7; max-width:62ch; margin:0; color:#CFC9EC;\">Mir sind Klarheit, Verantwortlichkeit und ein Mensch im entscheidenden Moment wichtig. Governance als Praxis, die Menschen befähigt, nicht als Papierkram, der sie ausbremst.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROJECTS -->\n  <section id=\"projects\" data-screen-label=\"Projekte\" style=\"background:#FAFAF2; color:#2C2280; border-top:3px solid #2C2280;\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:96px 32px;\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:8px; flex-wrap:wrap;\">\n        <h2 style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:clamp(40px,6vw,80px); line-height:0.9; letter-spacing:-0.03em; margin:0; text-transform:uppercase;\">Ausgewählte<br>Projekte<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.2em; color:#6E66A6; padding-bottom:10px;\">02 · Vier Dinge, die ich gebaut habe<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ projects }}\" as=\"proj\" hint-placeholder-count=\"3\">\n        <a href=\"{{ proj.href }}\" target=\"_blank\" rel=\"noopener\" style=\"display:grid; grid-template-columns:64px 0.34fr 0.66fr; gap:32px; align-items:start; padding:40px 0; border-top:3px solid #2C2280; text-decoration:none; color:#2C2280;\" style-hover=\"background:#E9E70C;\">\n          <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:28px; line-height:1; letter-spacing:-0.02em;\">{{ proj.num }}<\u002Fdiv>\n          <div>\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.18em; color:#6E66A6; margin-bottom:14px;\">{{ proj.tag }}<\u002Fdiv>\n            <h3 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(26px,2.6vw,36px); line-height:1.05; letter-spacing:-0.02em; margin:0;\">{{ proj.title }}<\u002Fh3>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-family:'Archivo',sans-serif; font-weight:400; font-size:17px; line-height:1.6; margin:0 0 18px; max-width:54ch; color:#443A9C;\">{{ proj.desc }}<\u002Fp>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; display:inline-flex; align-items:center; gap:8px; border-bottom:2px solid #2C2280; padding-bottom:3px;\">{{ proj.cta }} ↗<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n      <div style=\"border-top:3px solid #2C2280;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer data-screen-label=\"Footer\" style=\"background:#E9E70C; color:#2C2280; border-top:3px solid #2C2280;\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:72px 32px 40px; display:flex; flex-direction:column; gap:40px;\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:32px; flex-wrap:wrap;\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.2em; margin-bottom:18px;\">Lass uns reden<\u002Fdiv>\n          <h2 style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:clamp(18px,2vw,26px); line-height:0.86; letter-spacing:-0.02em; margin:0; text-transform:uppercase;\">Anca Trif<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"https://www.linkedin.com/in/ancatrif\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; background:#2C2280; color:#E9E70C; text-decoration:none; padding:16px 26px; border:3px solid #2C2280;\" style-hover=\"background:transparent; color:#2C2280;\">LinkedIn ↗<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"border-top:3px solid #2C2280; padding-top:20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:#382E8F;\">\n        <span>© 2026<\u002Fspan>\n        <span>Operative Befähigung · Bauen mit KI · Gesunde Governance<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { useCasesOpen: false, learningToolsOpen: false };\n  renderVals() {\n    return {\n      useCasesOpen: this.state.useCasesOpen,\n      openUseCases: () => this.setState({ useCasesOpen: true }),\n      closeUseCases: () => this.setState({ useCasesOpen: false }),\n      learningToolsOpen: this.state.learningToolsOpen,\n      openLearningTools: () => this.setState({ learningToolsOpen: true }),\n      closeLearningTools: () => this.setState({ learningToolsOpen: false }),\n      projects: [\n        {\n          num: \"01\",\n          tag: \"KI · Produkt\",\n          title: \"Produkt und Engineering\",\n          desc: \"Das A³ KI-Einsatz-Entscheidungstool hilft Produkt- und Engineering-Teams zu entscheiden, ob bei einer bestimmten Aufgabe KI automatisieren, unterstützen oder vermieden werden soll. Klassifizierungen fließen in ein lebendiges Register ein, eine praktische Form der KI-Governance ohne Richtlinien-Overhead.\",\n          cta: \"Mehr erfahren\",\n          href: \"https://ancatrif.com/a3-tool/\"\n        },\n        {\n          num: \"02\",\n          tag: \"KI · Automatisierung\",\n          title: \"Personal und Kultur\",\n          desc: \"Das HR-Self-Service-Tool ist ein agentischer Workflow, der Routine-HR-Fragen (Urlaubssalden, Krankmeldung, Unternehmensrichtlinien) ohne Mensch im Loop beantwortet. Vollständig in n8n gebaut, verbindet es einen Webhook, eine Datenabfrage und Claude, wobei jeder Austausch zur Prüfung protokolliert wird.\",\n          cta: \"Mehr erfahren\",\n          href: \"https://ancatrif.com/hr-agent/\"\n        },\n        {\n          num: \"03\",\n          tag: \"KI · RAG · Automatisierung\",\n          title: \"Teamübergreifende Zusammenarbeit\",\n          desc: \"Der Loop Brief Agent ist ein Tool, das die verstreuten Updates eines Teams liest: Tickets, Slack-Nachrichten, Retro-Notizen, und daraus das einseitige Briefing für das wöchentliche Sync-Meeting schreibt. Ein Mensch prüft und bearbeitet, bevor etwas versendet wird.\",\n          cta: \"Mehr erfahren\",\n          href: \"https://loop-brief-presentation.onrender.com/\"\n        },\n        {\n          num: \"04\",\n          tag: \"KI · Compliance\",\n          title: \"DSGVO- & EU-KI-Gesetz-Quiz\",\n          desc: \"Ein Quiz, das Einzelpersonen und Teams hilft, sich mit Compliance vertraut zu machen. Enthält eine KI-gestützte Bonusrunde, die auf Abruf neue Fragen generiert.\",\n          cta: \"Quiz starten\",\n          href: \"https://gdpr-quiz.ancatrif.com\"\n        }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
