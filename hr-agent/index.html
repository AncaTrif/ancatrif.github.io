  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tool/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">Product and Engineering<\u002Fa>\n                  <a href=\"https://ancatrif.com/hr-agent/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">People and Culture<\u002Fa>\n                  <a href=\"https://loop-brief-presentation.onrender.com/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">Cross-Team Collaboration<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"position:relative;\" sc-camel-on-mouse-enter=\"{{ openLearningTools }}\" sc-camel-on-mouse-leave=\"{{ closeLearningTools }}\">\n            <span style=\"color:#2C2280; cursor:pointer; display:inline-flex; align-items:center; gap:4px;\">Learning Tools <span style=\"font-size:9px;\">▾<\u002Fspan><\u002Fspan>\n            <sc-if value=\"{{ learningToolsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute; top:100%; left:0; padding-top:12px; min-width:260px;\">\n                <div style=\"background:#2C2280; border:3px solid #2C2280; display:flex; flex-direction:column;\">\n                  <a href=\"https://gdpr-quiz.ancatrif.com\" target=\"_blank\" rel=\"noopener\" style=\"color:#E9E70C; text-decoration:none; padding:14px 18px; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.12em;\" style-hover=\"background:#382E8F;\">GDPR &amp; EU AI Act Quiz<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fnav>\n\n    <sc-if value=\"{{ mobileMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-top:3px solid #2C2280; background:#2C2280; display:flex; flex-direction:column; padding:8px 32px 24px;\">\n        <a href=\"https://ancatrif.com/#about\" style=\"color:#E9E70C; text-decoration:none; padding:16px 0; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;\">About<\u002Fa>\n        <a href=\"https://ancatrif.com/#projects\" style=\"color:#E9E70C; text-decoration:none; padding:16px 0; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;\">Projects<\u002Fa>\n        <div style=\"padding:16px 0 4px; color:#9B93D6; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #443A9C;\">Use Cases<\u002Fdiv>\n        <a href=\"https://ancatrif.com/a3-tool/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 0 14px 16px; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;\">Product and Engineering<\u002Fa>\n        <a href=\"https://ancatrif.com/hr-agent/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 0 14px 16px; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;\">People and Culture<\u002Fa>\n        <a href=\"https://loop-brief-presentation.onrender.com/\" style=\"color:#E9E70C; text-decoration:none; padding:14px 0 14px 16px; border-bottom:1px solid #443A9C; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;\">Cross-Team Collaboration<\u002Fa>\n        <div style=\"padding:16px 0 4px; color:#9B93D6; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid #443A9C;\">Learning Tools<\u002Fdiv>\n        <a href=\"https://gdpr-quiz.ancatrif.com/\" target=\"_blank\" rel=\"noopener\" style=\"color:#E9E70C; text-decoration:none; padding:14px 0 14px 16px; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;\">GDPR &amp; EU AI Act Quiz<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <div style=\"max-width:900px; margin:0 auto; padding:0 32px;\">\n\n    <!-- BACK LINK -->\n    <div style=\"padding-top:40px;\">\n      <a href=\"https://ancatrif.com/#projects\" style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:500; text-decoration:none; color:#382E8F; display:inline-flex; align-items:center; gap:8px;\" style-hover=\"color:#2C2280;\">← Back to portfolio<\u002Fa>\n    <\u002Fdiv>\n\n    <!-- HERO -->\n    <div style=\"padding:40px 0 56px; border-bottom:3px solid #2C2280;\">\n      <h1 style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:clamp(36px,6vw,60px); line-height:1.02; letter-spacing:-0.03em; margin:0 0 24px;\">HR Self-Service Agent<\u002Fh1>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px;\">\n        <sc-for list=\"{{ tags }}\" as=\"tag\" hint-placeholder-count=\"5\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; background:#E9E70C; color:#2C2280; padding:8px 18px; border-radius:999px;\">{{ tag }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-family:'Archivo',sans-serif; font-weight:400; font-size:18px; line-height:1.6; max-width:56ch; margin:0 0 32px; color:#2C2280;\">A proof-of-concept agentic workflow testing one specific assumption: that an employee can get a satisfactory answer to a routine HR question from an AI agent often enough that HR doesn't need to be in the loop. Built end to end in n8n: webhook, data lookup, prompt assembly, Claude, logging, response.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:16px; margin-bottom:32px;\">\n        <a href=\"https://hr-self-service-poc.onrender.com/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-size:16px; font-weight:700; background:#2C2280; color:#FAFAF2; text-decoration:none; padding:16px 30px; border:3px solid #2C2280; border-radius:999px; display:inline-block;\" style-hover=\"background:#382E8F;\">Try the demo →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"border:3px solid #2C2280; padding:28px 32px; background:#FFFFFF;\">\n        <p style=\"font-family:'Archivo',sans-serif; font-size:16px; line-height:1.6; margin:0; color:#2C2280;\"><strong>This is a demo with synthetic data.<\u002Fstrong> All 20 employee records, names, and balances are made up, no real company, no real HR data. The point is to test the mechanism, not to represent any actual organisation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ACCORDION SECTIONS -->\n    <div style=\"padding:40px 0; display:flex; flex-direction:column; gap:24px;\">\n      <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"6\">\n        <div style=\"border:3px solid #2C2280;\">\n          <div sc-camel-on-click=\"{{ sec.toggle }}\" style=\"padding:28px 32px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:24px; background:#E9E70C;\">\n            <h2 style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; letter-spacing:0.04em; text-transform:uppercase; margin:0; color:#2C2280;\">{{ sec.title }}<\u002Fh2>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:#2C2280; flex-shrink:0; transition:transform 0.2s;\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ sec.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-if value=\"{{ sec.isArchitecture }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:32px; font-family:'Archivo',sans-serif; font-size:17px; line-height:1.7; color:#2C2280; background:#FFFFFF; border-top:3px solid #2C2280;\">\n                <p style=\"margin:0 0 28px;\">The workflow runs as a single n8n pipeline triggered by a webhook. Six nodes, no framework, no custom backend.<\u002Fp>\n\n                <div style=\"display:flex; flex-direction:column;\">\n                  <sc-for list=\"{{ flowSteps }}\" as=\"step\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex; flex-direction:column;\">\n                      <div style=\"display:flex; gap:20px; align-items:flex-start;\">\n                        <div style=\"flex-shrink:0; width:36px; height:36px; border-radius:50%; background:#2C2280; color:#E9E70C; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;\">{{ step.num }}<\u002Fdiv>\n                        <div style=\"flex:1; border:2px solid #2C2280; background:#FAFAF2; padding:16px 20px; margin-bottom:{{ step.marginBottom }};\">\n                          <div style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;\">{{ step.title }}<\u002Fdiv>\n                          <div style=\"font-family:'Archivo',sans-serif; font-size:16px; line-height:1.5;\">{{ step.desc }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ step.showArrow }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"margin-left:17px; font-family:'JetBrains Mono',monospace; color:#6E6A8C; font-size:16px; padding:6px 0;\">↓<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:32px;\">\n                  <img src=\"d3b30594-e497-4c5b-99cf-c164db071931\" alt=\"n8n workflow canvas for the HR self-service agent\" style=\"width:100%; height:auto; border:3px solid #2C2280; display:block;\">\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:#6E6A8C; margin-top:10px;\">The actual n8n workflow canvas<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sec.isDefault }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:32px; font-family:'Archivo',sans-serif; font-size:17px; line-height:1.7; color:#2C2280; background:#FFFFFF; border-top:3px solid #2C2280; white-space:pre-line;\">\n                {{ sec.body }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- MODEL CARD -->\n    <div style=\"padding:0 0 40px;\">\n      <div style=\"border:3px solid #2C2280;\">\n        <div sc-camel-on-click=\"{{ toggleModelCard }}\" style=\"padding:28px 32px; background:#E9E70C; display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:24px;\">\n          <h2 style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; letter-spacing:0.04em; text-transform:uppercase; margin:0; color:#2C2280;\">Model card<\u002Fh2>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:#2C2280; flex-shrink:0; transition:transform 0.2s;\">▼<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ modelCardOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:32px; background:#FFFFFF; border-top:3px solid #2C2280;\">\n          <p style=\"font-family:'Archivo',sans-serif; font-size:17px; line-height:1.7; margin:0 0 28px; color:#2C2280;\">This workflow runs on <strong>Claude Sonnet 4.6<\u002Fstrong>, built by Anthropic.<\u002Fp>\n          <sc-for list=\"{{ modelCard }}\" as=\"row\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid; grid-template-columns:0.24fr 0.76fr; gap:24px; padding:20px 0; border-top:1px solid #D8D4C0;\">\n              <div style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:#6E6A8C;\">{{ row.label }}<\u002Fdiv>\n              <div style=\"font-family:'Archivo',sans-serif; font-size:17px; line-height:1.6; color:#2C2280;\">{{ row.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CREDITS -->\n    <div style=\"padding:0 0 40px;\">\n      <div style=\"border:3px solid #2C2280;\">\n        <div sc-camel-on-click=\"{{ credits.toggle }}\" style=\"padding:28px 32px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:24px; background:#E9E70C;\">\n          <h2 style=\"font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; letter-spacing:0.04em; text-transform:uppercase; margin:0; color:#2C2280;\">{{ credits.title }}<\u002Fh2>\n          <span style=\"font-family:'JetBrains Mono',monospace; font-size:14px; color:#2C2280; flex-shrink:0; transition:transform 0.2s;\">▼<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ credits.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:32px; font-family:'Archivo',sans-serif; font-size:17px; line-height:1.7; color:#2C2280; background:#FFFFFF; border-top:3px solid #2C2280;\">\n            {{ credits.body }}\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#2C2280; color:#FAFAF2; border-top:3px solid #2C2280; margin-top:40px;\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:40px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;\">\n      <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:16px;\">Anca Trif<\u002Fdiv>\n      <div style=\"display:flex; gap:24px;\">\n        <a href=\"https://www.linkedin.com/in/ancatrif\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#E9E70C; text-decoration:none;\" style-hover=\"color:#FAFAF2;\">LinkedIn ↗<\u002Fa>\n        <a href=\"https://ancatrif.substack.com/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#E9E70C; text-decoration:none;\" style-hover=\"color:#FAFAF2;\">Substack ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { openIndex: 0, modelCardOpen: true, useCasesOpen: false, learningToolsOpen: false, isMobile: (typeof window !== 'undefined' && window.innerWidth < 760), mobileMenuOpen: false };\n\n  componentDidMount() {\n    this._onResize = () => this.updateIsMobile();\n    window.addEventListener('resize', this._onResize);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  updateIsMobile() {\n    const isMobile = window.innerWidth < 760;\n    if (isMobile !== this.state.isMobile) {\n      this.setState({ isMobile, mobileMenuOpen: isMobile ? this.state.mobileMenuOpen : false });\n    }\n  }\n\n  renderVals() {\n    const raw = [\n      {\n        title: \"The problem it solves\",\n        body: \"HR teams spend a meaningful share of their week answering the same handful of questions: how many vacation days are left, where the handbook lives, what the remote work policy says. None of it is hard to answer. All of it is repetitive enough to keep HR reactive instead of strategic. The core assumption worth testing isn't whether AI can answer these questions, it's whether employees will actually accept the answer often enough that they don't immediately escalate to a human anyway. That's the only thing this PoC is built to find out. Everything else, polish, integration breadth, UI, is secondary until that's true.\"\n      },\n      {\n        title: \"Design choices and tradeoffs\",\n        body: \"The brief explicitly called for buying information, not building software. That shaped every decision: no authentication, no production HRIS integration, no polished UI at the backend stage. The fastest path to a real answer was to fake the hard parts and test the real part. Two deliberate omissions worth naming. A manually populated spreadsheet stands in for a live HRIS connection (Workday, BambooHR); wiring up a real one would have taken weeks and told me nothing about whether the agent's answers are good. And five policy documents are pasted directly into the system prompt rather than chunked into a vector database, since five documents under 10k tokens don't need retrieval infrastructure yet. Both would be wrong choices in production, and both are exactly right for a two-week test.\"\n      },\n      {\n        title: \"Architecture in plain language\",\n        body: \"The workflow runs as a single n8n pipeline triggered by a webhook. Six nodes, no framework, no custom backend. Webhook trigger: receives a POST request containing an employee ID and a question. Google Sheets lookup: fetches the row matching that employee ID from a spreadsheet of 20 synthetic records. Code node: assembles a system prompt combining the employee's record with the relevant policy text. Claude Sonnet 4.6: answers the question, grounded only in the data it was given, instructed to decline anything outside that scope. From there it splits into two parallel branches: respond to webhook, which returns the answer as the HTTP response immediately, and logging, which appends timestamp, employee ID, question, and answer to a separate sheet for review. The reply goes out the moment Claude responds, logging happens independently and never delays what the employee sees.\"\n      },\n      {\n        title: \"What it is not ready for yet\",\n        body: \"SSO authentication: right now the employee ID is typed by hand, which means anyone can request anyone's data. Identity needs to come from a login token, not user input. Live HRIS connection: the Google Sheet is a stand-in. Real deployment needs a Workday or BambooHR API call so the data stays current and is only writable by HR systems. Rate limiting: an open webhook with no limits can be hit repeatedly, running up API costs with no benefit. Audit logging tied to identity: the current log captures the exchange, but not a verified identity, in an HR context, auditability is not optional. Vector store for policies: pasting five documents into a system prompt works at this scale. Fifty documents would need retrieval, not inlining. None of this is complex in principle. All of it needs to be in place before any real employee record touches the system.\"\n      },\n      {\n        title: \"How it would scale\",\n        body: \"The sequence matters: identity and access control first, then a live data connection, then retrieval for the policy library, then, only once the foundation holds, additional surfaces like Slack or a richer chat interface. The architecture itself doesn't need to change much as it scales. The same six-step shape (receive, look up, assemble context, ask the model, log, respond) holds whether the data source is a spreadsheet or an enterprise HRIS, and whether five documents are inlined or fifty are retrieved from a vector store.\"\n      },\n      {\n        title: \"Reflection\",\n        body: \"Building this in n8n rather than from scratch in code surfaced a different kind of learning than I expected. The logic was never the hard part, the friction was almost always in the gap between what a node's interface implies it does and what it actually expects as input. That's a different debugging muscle than reading a stack trace: it means testing one node at a time and trusting the output panel over your assumptions about how a field should behave.\"\n      }\n    ];\n\n    const creditsSection = {\n      title: \"Credits\",\n      body: \"Built in n8n, an open-source workflow automation tool, connected to the Anthropic API. The data and policy documents are entirely synthetic, written for this demo and not drawn from any real company.\"\n    };\n\n    const sections = raw.map((s, i) => ({\n      title: s.title,\n      body: s.body,\n      isOpen: this.state.openIndex === i,\n      isArchitecture: i === 2,\n      isDefault: i !== 2,\n      arrowStyle: this.state.openIndex === i ? \"transform:rotate(180deg);\" : \"transform:rotate(0deg);\",\n      toggle: () => this.setState(st => ({ openIndex: st.openIndex === i ? -1 : i }))\n    }));\n\n    const flowStepsRaw = [\n      { num: 1, title: \"Webhook trigger\", desc: \"Receives a POST request containing an employee ID and a question.\" },\n      { num: 2, title: \"Google Sheets lookup\", desc: \"Fetches the row matching that employee ID from a spreadsheet of 20 synthetic records.\" },\n      { num: 3, title: \"Code node\", desc: \"Assembles a system prompt combining the employee's record with the relevant policy text.\" },\n      { num: 4, title: \"Claude Sonnet 4.6\", desc: \"Answers the question, grounded only in the data it was given, instructed to decline anything outside that scope.\" },\n      { num: \"5a / 5b\", title: \"Respond to webhook + Logging (parallel)\", desc: \"The answer is returned as the HTTP response immediately, while a separate branch appends timestamp, employee ID, question, and answer to a log sheet for review. The reply never waits on the log.\" }\n    ];\n    const flowSteps = flowStepsRaw.map((s, i) => ({ ...s, showArrow: i < flowStepsRaw.length - 1, marginBottom: i < flowStepsRaw.length - 1 ? \"0\" : \"0\" }));\n\n    const modelCard = [\n      { label: \"Good at\", value: \"Answering narrowly within the data it's given, and declining clearly when something falls outside that scope.\" },\n      { label: \"Watch out for\", value: \"The agent only knows what's in its system prompt. It has no way to verify the employee ID is real, that check has to happen before the model is ever called.\" },\n      { label: \"Safety\", value: \"Refused over 98% of harmful requests in Anthropic's testing. Deployed at AI Safety Level 2.\" },\n      { label: \"Your role\", value: \"Every response in this PoC is logged for review, not auto-trusted. A human checks the log to see where the agent's answers are reliable and where they're not.\" },\n      { label: \"Data\", value: \"Inputs are synthetic and sent to the Anthropic API. No real employee data is used anywhere in this demo.\" }\n    ];\n\n    const credits = {\n      title: creditsSection.title,\n      body: creditsSection.body,\n      isOpen: this.state.openIndex === \"credits\",\n      arrowStyle: this.state.openIndex === \"credits\" ? \"transform:rotate(180deg);\" : \"transform:rotate(0deg);\",\n      toggle: () => this.setState(st => ({ openIndex: st.openIndex === \"credits\" ? -1 : \"credits\" }))\n    };\n\n    const modelCardOpen = this.state.modelCardOpen;\n    const modelCardArrowStyle = modelCardOpen ? \"transform:rotate(180deg);\" : \"transform:rotate(0deg);\";\n    const toggleModelCard = () => this.setState(st => ({ modelCardOpen: !st.modelCardOpen }));\n\n    const tags = [\"AI\", \"AUTOMATION\", \"N8N\", \"CLAUDE\", \"2026\"];\n\n    return {\n      sections, flowSteps, modelCard, credits, modelCardOpen, modelCardArrowStyle, toggleModelCard, tags,\n      useCasesOpen: this.state.useCasesOpen,\n      openUseCases: () => this.setState({ useCasesOpen: true }),\n      closeUseCases: () => this.setState({ useCasesOpen: false }),\n      learningToolsOpen: this.state.learningToolsOpen,\n      openLearningTools: () => this.setState({ learningToolsOpen: true }),\n      closeLearningTools: () => this.setState({ learningToolsOpen: false }),\n      isMobile: this.state.isMobile,\n      isDesktop: !this.state.isMobile,\n      mobileMenuOpen: this.state.isMobile && this.state.mobileMenuOpen,\n      toggleMobileMenu: () => this.setState(st => ({ mobileMenuOpen: !st.mobileMenuOpen })),\n      navPadding: this.state.isMobile ? \"20px 20px\" : \"32px\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
