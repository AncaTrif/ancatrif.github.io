document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 #E9E70C; text-decoration: none; padding: 14px 0 14px 16px; border-bottom: 1px solid #443A9C; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em;\">GDPR &amp; EU AI Act Quiz<\u002Fa>\n        <span style=\"color: #E9E70C; padding: 16px 0 0; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em;\">EN / <a href=\"https://ancatrif.com/de/lead-qualifier/\" style=\"color: #E9E70C; text-decoration: none;\">DE<\u002Fa><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <div style=\"max-width: 900px; margin: 0 auto; padding: 0 32px;\">\n\n    <div style=\"padding-top: 40px;\">\n      <a href=\"https://ancatrif.com/#projects\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; text-decoration: none; color: #382E8F; display: inline-flex; align-items: center; gap: 8px;\">← Back to portfolio<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"padding: 24px 0 40px; border-bottom: 3px solid #2C2280;\">\n      <h1 style=\"font-family: Archivo, sans-serif; font-weight: 900; font-size: clamp(28px, 4.4vw, 44px); line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 22px;\">Sales Lead Qualifier<\u002Fh1>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px;\">\n        <sc-for list=\"{{ tags }}\" as=\"tag\" hint-placeholder-count=\"5\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: #E9E70C; color: #2C2280; padding: 8px 18px; border-radius: 999px;\">{{ tag }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size: 18px; line-height: 1.65; max-width: 66ch; margin: 0 0 28px; color: #2C2280;\">A proof-of-concept agentic workflow testing one specific assumption: that an agent which decides for itself what to check, and says plainly when it cannot call a lead, earns the right to go unreviewed on everything else. Built end to end in n8n: webhook, two tools the model chooses between, scoring, confidence-based routing, logging, Slack.<\u002Fp>\n      <a href=\"https://lead-qualifier-demo.onrender.com/\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; font-weight: 700; font-size: 16px; text-decoration: none; background: #2C2280; color: #FAFAF2; padding: 15px 32px; border: 3px solid #2C2280; border-radius: 999px;\">Try the demo →<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"border: 3px solid #2C2280; background: #FFFFFF; padding: 22px 26px; margin: 32px 0 0; font-size: 16px; line-height: 1.6;\">\n      <strong>This is a demo with synthetic data.<\u002Fstrong> The agent draws on two tables of synthetic data built for this demo: contact history and company records, standing in for a real CRM and enrichment provider.\n    <\u002Fdiv>\n\n    <div style=\"padding: 32px 0 0; display: flex; flex-direction: column; gap: 20px;\">\n      <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <div style=\"border: 3px solid #2C2280;\">\n          <div sc-camel-on-click=\"{{ s.toggle }}\" style=\"padding: 22px 28px; background: #E9E70C; display: flex; align-items: center; justify-content: space-between; gap: 20px; cursor: pointer;\">\n            <h2 style=\"font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; color: #2C2280;\">{{ s.title }}<\u002Fh2>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2C2280; flex-shrink: 0;\">{{ s.arrow }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ s.isOpen }}\">\n            <div style=\"padding: 32px; background: #FFFFFF; border-top: 3px solid #2C2280; font-size: 17px; line-height: 1.7; color: #2C2280;\">\n\n              <sc-if value=\"{{ s.isDefault }}\">\n                <p style=\"margin: 0; white-space: pre-line;\">{{ s.body }}<\u002Fp>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s.isValue }}\">\n                <p style=\"margin: 0;\">\n                  <sc-for list=\"{{ valueSegments }}\" as=\"seg\" hint-placeholder-count=\"9\"><span><sc-if value=\"{{ seg.bold }}\"><strong>{{ seg.text }}<\u002Fstrong><\u002Fsc-if><sc-if value=\"{{ seg.notBold }}\">{{ seg.text }}<\u002Fsc-if><\u002Fspan><\u002Fsc-for>\n                <\u002Fp>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s.isTradeoffs }}\">\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #2C2280; margin: 0 0 22px;\">Tradeoffs and what's next<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 22px; margin-bottom: 8px;\">\n                  <sc-for list=\"{{ tradeoffs }}\" as=\"it\" hint-placeholder-count=\"5\">\n                    <div>\n                      <h3 style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.4; margin: 0 0 6px; color: #2C2280;\">{{ it.t }}<\u002Fh3>\n                      <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">{{ it.b }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #2C2280; margin: 22px 0 8px;\">How it would scale<\u002Fdiv>\n                <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">{{ scaleText }}<\u002Fp>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ s.isFlow }}\">\n                <p style=\"margin: 0 0 24px;\">The workflow runs as a single n8n pipeline triggered by a webhook. One agent, two tools it chooses between, and a branch that decides who hears about the result.<\u002Fp>\n                <div style=\"display: flex; flex-direction: column;\">\n                  <sc-for list=\"{{ flow }}\" as=\"step\" hint-placeholder-count=\"5\">\n                    <sc-if value=\"{{ step.showArrow }}\">\n                      <div style=\"width: 56px; display: flex; justify-content: center; padding: 10px 0;\">\n                        <svg width=\"10\" height=\"18\" sc-camel-view-box=\"0 0 20 36\" fill=\"none\"><path d=\"M10 0V28M10 28L2 20M10 28L18 20\" stroke=\"#6E6A8C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: start; margin-bottom: 8px;\">\n                      <div style=\"width: 56px; height: 56px; border-radius: 999px; background: #2C2280; color: #E9E70C; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-align: center; line-height: 1.2;\">{{ step.n }}<\u002Fdiv>\n                      <div style=\"border: 3px solid #2C2280; background: #FAFAF2; padding: 18px 24px;\">\n                        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #2C2280; margin-bottom: 6px;\">{{ step.t }}<\u002Fdiv>\n                        <div style=\"font-family: Archivo, sans-serif; font-size: 16px; line-height: 1.6; color: #2C2280;\">{{ step.d }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin: 28px 0 0;\">\n                  <img src=\"0e7eb658-fe21-40ea-97b0-e1436322e6f3\" alt=\"n8n canvas: webhook triggers an AI Agent with CRM history and company info lookup tools, a code node parses the result, branches on an If node to log or alert Slack, and a second branch checks if the lead is hot before notifying the sales Slack channel.\" style=\"display: block; width: 100%; height: auto; border: 2px solid #2C2280; background: #FAFAF2;\">\n                  <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #6E6A8C; margin-top: 10px; text-align: center;\">The actual n8n workflow canvas<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"padding: 20px 0 40px;\">\n      <div style=\"border: 3px solid #2C2280;\">\n        <div sc-camel-on-click=\"{{ toggleModelCard }}\" style=\"padding: 22px 28px; background: #E9E70C; display: flex; align-items: center; justify-content: space-between; gap: 20px; cursor: pointer;\">\n          <h2 style=\"font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0; color: #2C2280;\">Model card<\u002Fh2>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2C2280;\">{{ modelCardArrow }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ modelCardOpen }}\">\n          <div style=\"padding: 32px; background: #FFFFFF; border-top: 3px solid #2C2280; font-size: 17px; line-height: 1.7;\">\n            <p style=\"margin: 0 0 22px;\">This workflow runs on <strong>Claude Sonnet 5<\u002Fstrong>, built by Anthropic.<\u002Fp>\n            <sc-for list=\"{{ modelCard }}\" as=\"row\" hint-placeholder-count=\"5\">\n              <div style=\"display: grid; grid-template-columns: 0.24fr 0.76fr; gap: 24px; padding: 18px 0; border-top: 1px solid #D8D4C0;\">\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #6E6A8C;\">{{ row.l }}<\u002Fdiv>\n                <div style=\"font-size: 16px; line-height: 1.6;\">{{ row.v }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <footer style=\"background: #2C2280; color: #FAFAF2; border-top: 3px solid #2C2280;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 40px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;\">\n      <div style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 16px;\">Anca Trif<\u002Fdiv>\n      <a href=\"https://www.linkedin.com/in/ancatrif\" target=\"_blank\" rel=\"noopener\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #E9E70C; text-decoration: none;\">LinkedIn ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { openIndex: -1, modelCardOpen: false, useCasesOpen: false, governanceOpen: false, isMobile: (typeof window !== 'undefined' && window.innerWidth < 900), mobileMenuOpen: false };\n\n  componentDidMount() {\n    this._onResize = () => {\n      const isMobile = window.innerWidth < 900;\n      if (isMobile !== this.state.isMobile) this.setState({ isMobile, mobileMenuOpen: isMobile ? this.state.mobileMenuOpen : false });\n    };\n    window.addEventListener('resize', this._onResize);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  renderVals() {\n    const rawSections = [\n      { title: \"The problem it solves\", body: \"Inbound leads arrive faster than anyone qualifies them properly. A rep either works them in order and spends real time on ones that were never going to convert, or skims and misjudges. The information needed to judge well, whether this person has engaged before and whether this company is even a fit, sits in two or three systems nobody opens for every form fill.\\n\\nRule-based scoring already handles most of this well, and where fit is cleanly expressible, a rule stays the better tool: cheaper, more predictable, easier to audit. The real question this agent tests is whether self-reported uncertainty can be trusted enough to justify exception-only review, so a human only sees the leads the agent couldn't confidently call. When that trust holds, review scales without reviewing everything.\" },\n      { title: \"Business value\", kind: \"value\" },\n      { title: \"Design choices and tradeoffs\", kind: \"tradeoffs\" },\n      { title: \"Architecture in plain language\", kind: \"flow\" }\n    ];\n\n    const sections = rawSections.map((s, i) => ({\n      title: s.title,\n      body: s.body,\n      isOpen: this.state.openIndex === i,\n      arrow: this.state.openIndex === i ? \"▲\" : \"▼\",\n      isValue: s.kind === \"value\",\n      isTradeoffs: s.kind === \"tradeoffs\",\n      isFlow: s.kind === \"flow\",\n      isDefault: !s.kind,\n      toggle: () => this.setState(st => ({ openIndex: st.openIndex === i ? -1 : i }))\n    }));\n\n    const tradeoffs = [\n      { t: \"Agent over rule, judgment over prediction\", b: \"CRMs already ship with rule-based scoring, and for clean criteria a rule is cheaper and easier to audit. Rules break in the messy middle: they can't weigh \\u201cdownloaded pricing twice but ignored three emails\\u201d against \\u201cvague message, unknown domain,\\u201d and they can't say they're unsure. That gap is why an agent was worth building. It's also not trying to out-predict a model trained on a company's own closed-won and closed-lost history; that's a job for machine learning, not an LLM reasoning from scratch. The split: ML for the number, an LLM for reading the message and flagging uncertainty.\" },\n      { t: \"Confidence decides who's needed, not just the score\", b: \"A confident read gets logged and, if hot, handed to sales. An uncertain one goes to a human. Only self-reported uncertainty triggers review, so a confidently wrong lead slips through untouched. The fix worth building: sample a slice of confident decisions for review anyway, so the system gets measured rather than trusted.\" },\n      { t: \"Tool use left to the model\", b: \"The prompt describes what each lookup is for and leaves the decision to the model, no fixed order, no requirement to call both. On a personal email with no company attached, the agent skips the company lookup on its own.\" },\n      { t: \"Fixtures and presets stand in for live systems\", b: \"Two spreadsheets stand in for contact history and company data, systems that are separate and differently sourced in production. Presets replace a free-text form for the same reason: a made-up lead misses both lookups and returns the same flat result every time, while presets produce genuinely different paths.\" },\n      { t: \"Lightweight infra, matched to the risk\", b: \"No auth, no rate limiting, no proxy, unlike Loop Brief Agent, which hides its backend URL, locks CORS, rate-limits, and validates free text behind a Render proxy. With four fixed leads and no free-text surface, only the CORS piece applies here, handled directly via response headers on the webhook node.\" }\n    ];\n\n    const scaleText = \"Two things sharpen at production scale. The score itself: three levels is coarse, and a 0 to 100 scale would let a team move the threshold without redefining what \\u201chot\\u201d means. And the loop: it currently ends at Slack, where a person reads the alert and acts elsewhere. Closing it means interactive Slack buttons that post a decision back to a webhook and write it to the CRM record.\";\n\n    const flowRaw = [\n      { n: 1, t: \"Webhook trigger\", d: \"Receives a POST containing a lead's name, email, company domain, and the message they sent.\" },\n      { n: 2, t: \"AI Agent\", d: \"Claude reads the lead and decides which of two lookups to run. Contact history is keyed by email, company data by domain. It can call both, one, or neither.\" },\n      { n: 3, t: \"Code node\", d: \"The model wraps its JSON in prose, so this pulls out the first object it finds and parses it. If parsing fails, the lead is marked low confidence, which sends it to a human rather than letting it slip through.\" },\n      { n: 4, t: \"Respond to webhook\", d: \"The score, the reasoning, the confidence, and the list of tools actually called go straight back to whatever submitted the lead.\" },\n      { n: 5, t: \"Route on confidence, then on score\", d: \"Low confidence posts to a review channel in Slack. High confidence and hot posts to the sales channel. Everything else is logged quietly. Every lead is logged either way.\" }\n    ];\n    const flow = flowRaw.map((s, i) => ({ ...s, showArrow: i > 0 }));\n\n    const valueSegments = [\n      { text: \"This agent scores and routes leads within \" },\n      { text: \"seconds\", bold: true },\n      { text: \", matching what sales research shows is the strongest predictor of conversion: \" },\n      { text: \"response speed\", bold: true },\n      { text: \". It surfaces the lead worth calling today and produces a \" },\n      { text: \"consistent, explainable score\", bold: true },\n      { text: \" every time, unlike ad hoc human triage that's sharper on Monday than Friday. It runs for \" },\n      { text: \"cents per lead\", bold: true },\n      { text: \", and its entire efficiency case rests on one thing: the confidence flags have to reliably catch the leads that actually need a human.\" }\n    ].map(seg => ({ ...seg, notBold: !seg.bold }));\n\n    const modelCard = [\n      { l: \"Good at\", v: \"Weighing a handful of mixed signals into a judgment, explaining that judgment in a sentence a person can argue with, and declining to commit when the evidence is thin.\" },\n      { l: \"Watch out for\", v: \"It reports which tools it called, but that report comes from the model, not from the workflow. It has matched the execution log every time I have checked, and it is still self-reported rather than observed.\" },\n      { l: \"Safety\", v: \"Anthropic reports Sonnet 5 as safer than Sonnet 4.6 in agentic contexts specifically: better at refusing malicious requests, more resistant to hijack attempts through prompt injection, and with lower rates of hallucination and sycophancy. That agentic framing is the relevant one here, because this workflow hands the model live tools rather than asking it a single question.\" },\n      { l: \"Your role\", v: \"Low-confidence leads are the ones designed to reach you. Confident ones are logged and, if hot, passed to sales. That only works if someone occasionally checks whether the confident ones were right.\" },\n      { l: \"Data\", v: \"All contact and company records are synthetic. Lead details are sent to the Anthropic API. No real customer data is used anywhere in this demo.\" }\n    ];\n\n    const tags = [\"AGENTIC\", \"N8N\", \"CLAUDE\", \"TOOL-USE\", \"ROUTING\"];\n\n    return {\n      sections, tradeoffs, scaleText, flow, valueSegments, modelCard, tags,\n      modelCardOpen: this.state.modelCardOpen,\n      modelCardArrow: this.state.modelCardOpen ? \"▲\" : \"▼\",\n      toggleModelCard: () => this.setState(st => ({ modelCardOpen: !st.modelCardOpen })),\n      useCasesOpen: this.state.useCasesOpen,\n      openUseCases: () => this.setState({ useCasesOpen: true }),\n      closeUseCases: () => this.setState({ useCasesOpen: false }),\n      governanceOpen: this.state.governanceOpen,\n      openGovernance: () => this.setState({ governanceOpen: true }),\n      closeGovernance: () => this.setState({ governanceOpen: false }),\n      isMobile: this.state.isMobile,\n      isDesktop: !this.state.isMobile,\n      mobileMenuOpen: this.state.isMobile && this.state.mobileMenuOpen,\n      toggleMobileMenu: () => this.setState(st => ({ mobileMenuOpen: !st.mobileMenuOpen })),\n      navPadding: this.state.isMobile ? \"20px\" : \"32px\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
